[package]
name = "evaluatech-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "School AAAAA13 EvaluaTech single-binary pure-Rust full-stack Axum + SQLite + WebAssembly web & API server"

[lib]
name = "evaluatech_server"
path = "src/lib.rs"

[[bin]]
name = "evaluatech-server"
path = "src/main.rs"

[dependencies]
evaluatech-nlp = { path = "../evaluatech-nlp" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
bcrypt = "0.17"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.2"

[lints]
workspace = true
