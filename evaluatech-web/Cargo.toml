[package]
name = "evaluatech-web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "100% Pure-Rust WebAssembly (wasm32-unknown-unknown) Coolors Periwinkle-Blue Web Application for School AAAAA13 EvaluaTech"

[lib]
name = "evaluatech_web"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
evaluatech-nlp = { path = "../evaluatech-nlp" }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "Headers",
    "History",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Request",
    "RequestInit",
    "Response",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "Storage",
    "Window",
] }

[lints]
workspace = true
