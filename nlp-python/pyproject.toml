[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluatech-nlp-py"
version = "1.0.0"
description = "School AAAAA13 EvaluaTech Python NLP & Machine Learning Engine (calamanCy + VADER + scikit-learn)"
readme = "../README.md"
requires-python = ">=3.10"
authors = [
    { name = "AAAAA13-sys", email = "108907185+AAAAA13-sys@users.noreply.github.com" }
]
dependencies = [
    "calamancy>=0.2.0",
    "spacy>=3.7.0",
    "huggingface-hub>=0.23.0",
    "pyarrow>=16.0.0,<19.0.0",
    "vaderSentiment>=3.3.2",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "joblib>=1.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["evaluatech_nlp_py*"]
