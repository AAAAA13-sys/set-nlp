<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>School AAAAA13 — Faculty Evaluation Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'dark' || saved === 'light') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
                var scale = localStorage.getItem('font_scale');
                if (scale === 'large') {
                    document.documentElement.setAttribute('data-font-scale', 'large');
                }
            } catch (_) {}
        })();
    </script>
</head>
<body>
    <a href="#main-workspace" class="skip-link">Skip to main content</a>
    <div id="sr-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="app" aria-live="off">
        <main id="main-workspace" class="workspace-container" style="padding-top:3.5rem;">
            <div class="doc-sheet" style="max-width:520px;margin:0 auto;text-align:center;">
                <p class="institution-line" style="margin:0 0 0.4rem;">School AAAAA13 &middot; Office of Academic Affairs</p>
                <h1 class="sheet-title" style="margin:0;">Loading Faculty Evaluation Portal&hellip;</h1>
            </div>
        </main>
    </div>
    <script type="module">
        import init from '/pkg/evaluatech_web.js';
        init();
    </script>
</body>
</html>
